[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smpc"
version = "0.2.0"
description = "Совместный анализ клиентских баз банка и телекома: PSI, PSI-CA, PIS (прототип), ML на CKKS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openmined-psi>=2.0.6",
    "phe>=1.5",
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# CKKS (TenSEAL): нужен для backend "ckks"; без него тесты CKKS пропускаются.
he = ["tenseal>=0.3.14"]
dev = ["pytest>=8"]

[project.scripts]
smpc-demo = "smpc.demo:main"
smpc-compare = "smpc.experiments.bank_vs_joint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
